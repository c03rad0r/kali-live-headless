---
ventoy_device: ""
ventoy_confirm: "no"
ventoy_serial: ""

ventoy_cache_dir: "{{ lookup('env', 'HOME') }}/.cache/ventoy"
ventoy_iso_dir: "{{ ventoy_cache_dir }}/isos"
ventoy_mount_dir: "/mnt/ventoy-build"

ventoy_reserve_mib: 0      # unused space kept at the END of the disk
ventoy_secondary_boot_menu: "0"   # 0 = skip the "Boot in normal mode" menu (unattended)
ventoy_menu_mode: "1"      # 1 = tree view
ventoy_menu_timeout: "30"

ventoy_min_free_gb: 2
ventoy_allow_loop: false
ventoy_allow_large_usb: false
